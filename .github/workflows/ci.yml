name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/**"
      # site/ dependencies were outside every filter, so a PR that changed
      # only them triggered nothing while `build` and `dep-audit` stayed
      # REQUIRED -- unmergeable by construction. Found 2026-09-17 on the PR
      # migrating site/ off an astro release that cannot hold the sharp patch.
      # Deliberately the three files that change what gets BUILT or AUDITED,
      # not `site/**`: prose edits should not spend CI minutes.
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/**"
      # site/ dependencies were outside every filter, so a PR that changed
      # only them triggered nothing while `build` and `dep-audit` stayed
      # REQUIRED -- unmergeable by construction. Found 2026-09-17 on the PR
      # migrating site/ off an astro release that cannot hold the sharp patch.
      # Deliberately the three files that change what gets BUILT or AUDITED,
      # not `site/**`: prose edits should not spend CI minutes.
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build
      - run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: node

  dep-audit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
      - run: npm audit --omit=dev || true
